<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
    
        * {
            box-sizing: border-box; 
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            padding: 20px;
        }

        form {
            background-color: #ffe6f2; 
            width: 100%;
            max-width: 400px; 
            margin: auto; 
            padding: 20px; 
            border: 1px solid #ccc;
            border-radius: 10px; 
        }

        fieldset {
            border: none;
            margin: 0;
            padding: 0;
        }

        legend {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            color: #333;
        }

    
        label {
            display: block; 
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px; 
            font-size: 14px;
            background-color: #ffffff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border: 2px solid #c339df; 
        }
        
        textarea {
            resize: vertical; 
            min-height: 80px;
        }

        .inline-label {
            display: inline; 
            font-weight: normal;
            margin-right: 10px;
            margin-top: 0;
        }

        input[type="radio"], input[type="checkbox"] {
            margin-right: 5px;
        }


        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #ffffff;
            color: #555;
            font-size: 14px;
            text-align: center;
            font-weight: normal;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #d87ef3;
            color: white;
            border: none;
            border-radius: 5px; 
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
        }

        /* Efeito Hover no botão */
        button:hover {
            background-color: #9622cc;
        }
    </style>
</head>
<body>

    <form action="#" method="POST" enctype="multipart/form-data">
        <fieldset>
            <legend>Cadastro</legend>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

            <label for="data_nasc">Data de Nascimento:</label>
            <input type="date" id="data_nasc" name="data_nasc" required>

            <label for="curso">Curso:</label>
            <select id="curso" name="curso" required>
                <option value="" disabled selected>Selecione um curso</option>
                <option value="eng_software">Engenharia de Software</option>
                <option value="ciencia_comp">Ciência da Computação</option>
                <option value="eng_comp">Engenharia da Computação</option>
            </select>

            <label>Sexo:</label>
            <label class="inline-label"><input type="radio" name="sexo" value="masculino" required> Masculino</label>
            <label class="inline-label"><input type="radio" name="sexo" value="feminino" required> Feminino</label>
            <label class="inline-label"><input type="radio" name="sexo" value="outro" required> Outro</label>

            <label>Interesses:</label>
            <label class="inline-label"><input type="checkbox" name="interesses" value="front"> Front-end</label>
            <label class="inline-label"><input type="checkbox" name="interesses" value="qa"> QA</label>
            <label class="inline-label"><input type="checkbox" name="interesses" value="projetos"> Gerenciamento de projetos</label>

            <label for="comentarios">Comentários:</label>
            <textarea id="comentarios" name="comentarios" placeholder="Deixe um comentário aqui..."></textarea>

            <label>Upload de Foto:</label>
            <label for="foto" class="custom-file-upload">
            <input type="file" id="foto" name="foto" accept="image/*">
        </label>

            <button type="submit">Enviar Cadastro</button>
        </fieldset>
    </form>

</body>
</html>
